name: Terminal client

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --include=dev --include=optional --ignore-scripts
        working-directory: cli
      - run: npm run release:check
        working-directory: cli
      - run: node bin/gitmsg.mjs --help
        working-directory: cli
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: cli
      - run: npm run test:package -- "$RUNNER_TEMP"/yiaany-gitmsg-*.tgz
        working-directory: cli
